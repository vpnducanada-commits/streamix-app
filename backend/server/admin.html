<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamix - Administration</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0a0a0c;color:#f2f2f5;font:14px system-ui,sans-serif}
header{background:linear-gradient(135deg,#d81f26,#7b0b10);padding:14px;text-align:center;font-weight:700;letter-spacing:.25em;text-transform:uppercase;font-size:13px}
main{max-width:900px;margin:0 auto;padding:18px 14px 50px}
.card{background:#141418;border:1px solid #26262e;border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#ffb9bb}
label{display:block;font-size:12px;color:#a7a7b2;margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #26262e;background:#0e0e12;color:#f2f2f5;box-sizing:border-box}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;background:linear-gradient(135deg,#d81f26,#9c1015);color:#fff}
button.g{background:transparent;border:1px solid #26262e;color:#cfcfd8;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 130px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #26262e}
th{color:#9a9aa6;font-size:11px;text-transform:uppercase}
.p{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.ok{background:rgba(46,204,113,.15);color:#6ee7a0}
.warn{background:rgba(241,196,15,.15);color:#f6d365}
.bad{background:rgba(216,31,38,.2);color:#ff8f93}
.m{color:#8a8a95;font-size:12px}
.msg{margin-top:10px;font-size:13px;color:#ff8f93}
.hide{display:none}
.code{font-family:monospace;letter-spacing:.1em;background:#0e0e12;border:1px dashed #3a3a44;border-radius:9px;padding:10px;word-break:break-all}
</style>
</head>
<body>
<header>Streamix Administration</header>
<main>
<section id="login" class="card">
<h2>Connexion</h2>
<label>E-mail</label><input id="mail" type="email" value="vpnducanada@gmail.com">
<label>Mot de passe</label><input id="pwd" type="password" autocomplete="current-password">
<div class="row" style="margin-top:14px"><button id="go">Se connecter</button><button id="up" class="g">Créer ce compte</button><button id="out" class="g hide">Quitter</button></div>
<div id="lmsg" class="msg"></div>
<p class="m">Seul le compte autorisé côté serveur peut administrer. Un compte simplement inscrit n’a aucun droit.</p>
</section>
<section id="app" class="hide">
<div class="card">
<h2>Créer un code</h2>
<div class="row">
<div><label>Étiquette client</label><input id="lbl" placeholder="Client Libreville"></div>
<div><label>Durée en jours</label><input id="dys" type="number" min="1" placeholder="30"></div>
<div><label>Appareils</label><input id="dev" type="number" min="1" value="2"></div>
</div>
<div class="row" style="margin-top:12px"><button id="mk">Générer</button></div>
<div id="cmsg" class="msg"></div>
<div id="newc" class="hide" style="margin-top:12px"><p class="m">Affiché une seule fois : note-le maintenant.</p><div class="code" id="newv"></div></div>
</div>
<div class="card">
<h2>Codes</h2>
<div class="row">
<div><label>Recherche</label><input id="q" placeholder="étiquette ou id"></div>
<div><label>Statut</label><select id="st"><option value="all">Tous</option><option value="active">Actifs</option><option value="expired">Expirés</option><option value="revoked">Désactivés</option><option value="limit">Limite atteinte</option></select></div>
</div>
<div class="row" style="margin-top:12px"><button id="rf" class="g">Actualiser</button></div>
<div id="info" class="msg"></div>
<table><thead><tr><th>Étiquette</th><th>Statut</th><th>Appareils</th><th>Expire</th><th></th></tr></thead><tbody id="tb"></tbody></table>
</div>
</section>
<footer class="m" style="text-align:center;margin-top:18px">Streamix · administration serveur</footer>
</main>
<script>
(function(){
function $(i){return document.getElementById(i)}
function note(el,t,ok){el.textContent=t||'';el.style.color=ok?'#6ee7a0':'#ff8f93'}
function call(p,o){o=o||{};o.credentials='same-origin';o.headers={'Content-Type':'application/json'};
return fetch(p,o).then(function(r){return r.json().catch(function(){return{}}).then(function(b){return{s:r.status,b:b}})})}
function when(v){if(!v)return'jamais';var d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('fr-FR')}
function pill(c){if(c.revoked)return'<span class="p bad">Désactivé</span>';
if(c.expired)return'<span class="p warn">Expiré</span>';
if(c.maxDevices!==null&&c.devices>=c.maxDevices)return'<span class="p warn">Limite</span>';
return'<span class="p ok">Actif</span>'}
var list=[]
function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');load()}
function showLogin(){$('app').classList.add('hide');$('login').classList.remove('hide')}
function load(){call('/api/codes?search='+encodeURIComponent($('q').value.trim())+'&status='+$('st').value).then(function(r){
if(r.s===401){showLogin();return}
if(r.s!==200){note($('info'),'Erreur de chargement.');return}
list=r.b.codes||[];draw();note($('info'),list.length+' code(s).',1)})}
function draw(){var tb=$('tb');tb.innerHTML='';
if(!list.length){tb.innerHTML='<tr><td colspan="5" class="m">Aucun code.</td></tr>';return}
list.forEach(function(c){var tr=document.createElement('tr');
tr.innerHTML='<td>'+escapeHtml(c.label||'sans nom')+'<div class="m">'+c.id.slice(0,8)+'</div></td><td>'+pill(c)+'</td><td>'+c.devices+(c.maxDevices===null?' / ∞':' / '+c.maxDevices)+'</td><td>'+when(c.expiresAt)+'</td><td></td>';
var cell=tr.lastChild;
var b1=document.createElement('button');b1.className='g';b1.textContent='Appareils';b1.onclick=function(){devices(c)};
var b2=document.createElement('button');b2.className=c.revoked?'':'g';b2.textContent=c.revoked?'Réactiver':'Désactiver';
b2.style.marginLeft='6px';b2.onclick=function(){toggle(c)};
cell.appendChild(b1);cell.appendChild(b2);tb.appendChild(tr)})}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toggle(c){call('/api/codes?id='+c.id,{method:'PATCH',body:JSON.stringify({revoked:!c.revoked})}).then(function(r){
if(r.s!==200){note($('info'),'Action refusée.');return}
note($('info'),c.revoked?'Code réactivé.':'Code désactivé : accès coupé.',1);load()})}
function devices(c){call('/api/codes?id='+c.id).then(function(r){
if(r.s!==200){note($('info'),'Erreur appareils.');return}
var box=$('info');box.style.color='#cfcfd8';box.innerHTML='';
var h=document.createElement('div');h.textContent='Appareils de '+(c.label||c.id.slice(0,8))+':';box.appendChild(h);
var ds=r.b.devices||[];
if(!ds.length){var n=document.createElement('div');n.className='m';n.textContent='Aucun appareil.';box.appendChild(n);return}
ds.forEach(function(d){var l=document.createElement('div');l.className='m';l.style.marginTop='5px';
l.textContent='#'+d.slot+' '+d.key+'… dernière connexion '+when(d.lastSeen)+' ';
if(!d.revoked){var f=document.createElement('button');f.className='g';f.textContent='Libérer';
f.onclick=function(){free(c.id,d.key)};l.appendChild(f)}box.appendChild(l)})})}
function free(id,k){call('/api/codes?id='+id+'&device='+k,{method:'DELETE'}).then(function(r){
note($('info'),r.s===200?'Appareil libéré.':'Erreur.',r.s===200);load()})}
$('go').onclick=function(){var m=$('mail').value.trim(),p=$('pwd').value;
if(!m||!p){note($('lmsg'),'Renseigne l’e-mail et le mot de passe.');return}
$('go').disabled=true;
call('/api/signin',{method:'POST',body:JSON.stringify({email:m,password:p})}).then(function(r){
$('go').disabled=false;
if(r.s===200){$('pwd').value='';$('out').classList.remove('hide');showApp()}
else note($('lmsg'),'Connexion refusée. Vérifie l’adresse et le mot de passe.')})}
$('up').onclick=function(){var m=$('mail').value.trim(),p=$('pwd').value;
if(!m||!p){note($('lmsg'),'Renseigne l\u2019e-mail et un mot de passe.');return}
$('up').disabled=true;
call('/api/signup',{method:'POST',body:JSON.stringify({email:m,password:p,name:'Streamix'})}).then(function(r){
$('up').disabled=false;
if(r.s===200||r.s===201){note($('lmsg'),'Compte cr\u00e9\u00e9. Connecte-toi.',1);return}
var why=(r.b&&(r.b.message||r.b.code))||('erreur '+r.s);
note($('lmsg'),'Cr\u00e9ation impossible: '+why)})}
$('out').onclick=function(){call('/api/signout',{method:'POST'}).then(function(){$('out').classList.add('hide');showLogin()})}
$('mk').onclick=function(){$('mk').disabled=true;
call('/api/codes',{method:'POST',body:JSON.stringify({label:$('lbl').value.trim(),expiresInDays:$('dys').value,maxDevices:$('dev').value})}).then(function(r){
$('mk').disabled=false;
if(r.s===201){note($('cmsg'),'Code créé.',1);$('newc').classList.remove('hide');$('newv').textContent=r.b.code;$('lbl').value='';load()}
else note($('cmsg'),'Création refusée.')})}
$('rf').onclick=load;$('st').onchange=load;
$('q').oninput=function(){clearTimeout(window.__t);window.__t=setTimeout(load,350)};
call('/api/session').then(function(r){if(r.s===200&&r.b&&r.b.user){$('out').classList.remove('hide');showApp()}else showLogin()}).catch(showLogin);
})();
</script>
</body>
</html>
