apply plugin: 'com.android.application'

android {
    namespace 'com.streamix.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.streamix.app"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "16.0"
    }

    signingConfigs {
        // Même certificat que les versions précédentes : la mise à jour s'installe
        // par-dessus l'application existante, sans désinstallation.
        stable {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // Version publiée : non débogable, donc plus sûre que le build de debug.
            signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
