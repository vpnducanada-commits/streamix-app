<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Streamix</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{background:#0f0f0f;border:1px solid #222;border-radius:20px;padding:24px;max-width:900px;width:100%}
h1{font-size:18px;margin:0 0 6px}
p{color:#888;font-size:13px;margin:0 0 16px}
.preview{background:#000;border-radius:14px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:220px;border:1px solid #111}
.preview img{max-width:100%;height:auto}
.variants{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.variant{background:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:120px}
.variant.dark{background:#000;border:1px solid #1a1a1a}
.variant img{max-width:90%;height:auto}
.btn{margin-top:16px;background:#E50914;color:#fff;border:none;padding:12px 16px;border-radius:999px;font-weight:800;cursor:pointer;width:100%}
.small{font-size:11px;color:#666;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>STREAMIX — Logo typographique</h1>
<p>Play entre I et X • Noir & Blanc + Rouge #E50914</p>
<div class="preview"><img src="logo-streamix-play.png" alt="Streamix logo"></div>
<div class="variants">
<div class="variant"><img src="logo-streamix-play.png" style="filter:invert(1)" alt="logo white"></div>
<div class="variant dark"><img src="logo-streamix-play.png" alt="logo dark"></div>
</div>
<button class="btn" onclick="location.href='logo-streamix-play.png'" download>Télécharger PNG HD</button>
<p class="small">Fichier : logo-streamix-play.png • Utilisé comme splash + icône d'app • Version icône carrée disponible sur demande</p>
</div>
</body>
</html>
