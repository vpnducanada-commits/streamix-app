name: Build Android Native APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
    - uses: actions/checkout@v4

    - name: Generate icons
      run: |
        pip install Pillow
        python scripts/make-icons-native.py

    - name: Copy web files to assets
      run: |
        mkdir -p streamix-native/app/src/main/assets
        cp -r streamix/www streamix-native/app/src/main/assets/www

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        cd /tmp
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Verify Gradle
      run: |
        gradle --version

    - name: Build debug APK
      run: |
        cd streamix-native
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: streamix-apk
        path: streamix-native/app/build/outputs/apk/debug/app-debug.apk
