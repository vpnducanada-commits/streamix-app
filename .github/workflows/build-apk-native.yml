name: Build Android Native APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Copy web files to assets
      run: |
        mkdir -p streamix-native/app/src/main/assets
        cp -r www streamix-native/app/src/main/assets/www

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install Gradle
      run: |
        cd /tmp
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build debug APK
      run: |
        cd streamix-native
        set +e
        gradle assembleDebug --no-daemon --stacktrace > build-output.log 2>&1
        result=$?
        cat build-output.log
        if [ "$result" -ne 0 ]; then
          python3 - <<'PYLOG'
        from pathlib import Path
        data = Path('build-output.log').read_text(errors='replace')
        lines = data.splitlines()
        for i, line in enumerate(lines):
            if any(x in line for x in ['What went wrong:', ' error:', 'Could not ', 'FAILURE:', 'SDK location not found', 'failed for task', 'Caused by:']):
                for text in lines[i:min(i+4, len(lines))]:
                    print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
        PYLOG
          exit "$result"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: streamix-native-apk
        path: streamix-native/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
