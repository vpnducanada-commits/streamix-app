name: Build Android Native APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Copy web files to assets
      run: |
        mkdir -p streamix-native/app/src/main/assets
        cp -r www streamix-native/app/src/main/assets/www

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Gradle
      run: |
        cd /tmp
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Accept SDK licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Build debug APK
      run: |
        cd streamix-native
        gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
        BUILD_EXIT=$?
        tail -80 /tmp/build.log
        exit $BUILD_EXIT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: streamix-apk
        path: streamix-native/app/build/outputs/apk/debug/*.apk
